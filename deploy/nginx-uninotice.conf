# nginx 리버스 프록시 설정 템플릿.
# 서버에서: sudo cp deploy/nginx-uninotice.conf /etc/nginx/sites-available/uninotice
#          sudo ln -s /etc/nginx/sites-available/uninotice /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx
# 이후 certbot이 이 파일을 자동으로 수정해 443/SSL 블록을 추가합니다.
#
# server_name 자리에는 다음 중 하나를 넣으세요:
#   - 보유한 실제 도메인 (예: api.uninotice.example.com)
#   - 도메인이 없다면 sslip.io 무료 서비스: <IP를-대시로>.sslip.io
#     예: 서버 IP가 141.147.1.2 라면 -> 141-147-1-2.sslip.io
server {
    listen 80;
    server_name YOUR_DOMAIN_OR_SSLIP_HOST;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
